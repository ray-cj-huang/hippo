# `docker compose up -d db` for development; `docker compose --profile app up` also runs the
# backend from the same images CI publishes.
services:
  db:
    image: postgres:17-alpine
    ports:
      - "54322:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  integrator:
    profiles: [app]
    build: { context: ., args: { APP: integrator } }
    ports: ["127.0.0.1:4001:4001"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres?sslmode=disable
    depends_on:
      db: { condition: service_healthy }

  phoner:
    profiles: [app]
    build: { context: ., args: { APP: phoner } }
    ports: ["127.0.0.1:4000:4000"]
    env_file: .env
    environment:
      INTEGRATOR_URL: http://integrator:4001
    depends_on: [integrator]

volumes:
  db-data:
